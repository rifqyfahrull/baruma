# Build script paket berikut sengaja TIDAK dijalankan (perilaku yang sudah
# berlaku selama ini). pnpm v11 menolak jalan bila keputusan ini tidak
# eksplisit (ERR_PNPM_IGNORED_BUILDS), sehingga `pnpm exec` — termasuk
# webServer Playwright — gagal start. Nilai false = pertahankan status quo.
allowBuilds:
  # @sentry/nextjs pulls this in as a subdependency; kita TIDAK memakai
  # sentry-cli (tanpa source-map upload/CI auth token — lihat
  # instrumentation.ts), jadi build script binary-nya tak perlu jalan.
  '@sentry/cli': false
  core-js: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
