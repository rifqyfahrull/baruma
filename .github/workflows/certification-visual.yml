name: Certification Visual Benchmark

on:
  schedule:
    # Weekly visual/GPU smoke for the two exterior certification scenes.
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: certification-visual-benchmark
  cancel-in-progress: true

jobs:
  visual-benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --config.confirmModulesPurge=false

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run certification visual benchmark
        run: pnpm run test:e2e:certification
