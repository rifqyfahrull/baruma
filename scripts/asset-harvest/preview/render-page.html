<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #eef1f4; }
      #c { width: 512px; height: 512px; display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/three.module.js",
          "three/addons/": "/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c" width="512" height="512"></canvas>
    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js"

      const canvas = document.getElementById("c")
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false })
      renderer.setSize(512, 512, false)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.ACESFilmicToneMapping

      const scene = new THREE.Scene()
      scene.background = new THREE.Color("#eef1f4")

      // Pencahayaan studio ringan (hemispheric + 1 key) — netral, tanpa HDR.
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2))
      const key = new THREE.DirectionalLight(0xffffff, 2.0)
      key.position.set(3, 5, 4)
      scene.add(key)
      const fill = new THREE.DirectionalLight(0xffffff, 0.7)
      fill.position.set(-4, 2, -3)
      scene.add(fill)

      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000)

      const draco = new DRACOLoader()
      draco.setDecoderPath("/draco/")
      const loader = new GLTFLoader()
      loader.setDRACOLoader(draco)

      let current = null

      function disposeCurrent() {
        if (!current) return
        current.traverse((o) => {
          if (o.geometry) o.geometry.dispose()
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material]
            for (const m of mats) {
              for (const k in m) {
                const v = m[k]
                if (v && v.isTexture) v.dispose()
              }
              m.dispose()
            }
          }
        })
        scene.remove(current)
        current = null
      }

      // Global yang dipanggil Playwright. Load GLB, frame kamera 3/4, render,
      // balikan data URL WebP. Timeout & error dilempar supaya harness bisa skip.
      window.renderModel = async function (url) {
        disposeCurrent()
        const gltf = await loader.loadAsync(url)
        const model = gltf.scene
        current = model
        scene.add(model)

        // Frame: bbox → posisikan kamera pada sudut 3/4 sehingga model penuh.
        const box = new THREE.Box3().setFromObject(model)
        const size = new THREE.Vector3()
        const center = new THREE.Vector3()
        box.getSize(size)
        box.getCenter(center)
        const maxDim = Math.max(size.x, size.y, size.z) || 1
        const fov = (camera.fov * Math.PI) / 180
        let dist = (maxDim / 2) / Math.tan(fov / 2)
        dist *= 1.6 // sedikit ruang tepi
        const dir = new THREE.Vector3(1, 0.7, 1).normalize()
        camera.position.copy(center).addScaledVector(dir, dist)
        camera.lookAt(center)
        // Near/far DINAMIS sesuai jarak — model CC skalanya sembarang (bisa
        // ratusan/ribuan unit); far tetap (1000) meng-clip model jauh → blank.
        camera.near = Math.max(dist / 1000, 0.001)
        camera.far = dist * 10 + maxDim
        camera.updateProjectionMatrix()

        renderer.render(scene, camera)
        // WebP langsung dari canvas — tak perlu sharp.
        return canvas.toDataURL("image/webp", 0.82)
      }

      window.__ready = true
    </script>
  </body>
</html>
